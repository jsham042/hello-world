<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            padding: 5px;
            margin: 5px 0;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Division Calculator</h1>
    
    <form method="POST">
        <div>
            <label for="number1">First Number:</label>
            <input type="number" id="number1" name="number1" step="any" required>
        </div>
        
        <div>
            <label for="number2">Second Number:</label>
            <input type="number" id="number2" name="number2" step="any" required>
        </div>
        
        <input type="submit" value="Calculate">
    </form>

    {% if result is defined %}
        <div class="result">
            Result: {{ result }}
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}
</body>
</html>
